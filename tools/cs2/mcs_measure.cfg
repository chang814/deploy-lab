// mcs P0-5 measurement setup (offline / local server ONLY)
// Copy this file into:  <Steam>\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\
// Then in the CS2 console:  exec mcs_measure
// This file is copied by a human; mcs tools never write into CS2 folders.

sv_cheats 1
bot_kick
mp_warmup_end
mp_freezetime 0
mp_roundtime_defuse 60
mp_roundtime 60
mp_buy_anywhere 1
mp_buytime 9999
mp_startmoney 60000
mp_maxmoney 60000
sv_infinite_ammo 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
fps_max 0
cl_showfps 1
cl_showpos 1

// weapons used in the first measurement pass
give weapon_ak47
give weapon_usp_silencer

// F5 = slow motion on (0.1x), F6 = normal speed
bind "F5" "host_timescale 0.1"
bind "F6" "host_timescale 1"

echo "mcs_measure loaded. F5 = 0.1x slow motion, F6 = normal. Type 'version' and note the build."
