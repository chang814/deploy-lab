# CI（ADR 0002 §6）：每个 PR 和推送到 main 时运行。
# 升级 Godot 版本时只改 GODOT_VERSION，并单独提 PR。
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  linux:
    name: Linux（Godot 测试 + 通用 Python 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查 CHANGELOG 没有残留的合并冲突标记
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' CHANGELOG.md; then
            echo "CHANGELOG.md 中有未解决的合并冲突标记"; exit 1
          fi

      - name: 缓存 Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: 下载 Godot 并校验 SHA512
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: 导入工程
        run: ~/godot/godot --headless --path . --import

      - name: Godot 单元测试
        run: ~/godot/godot --headless --path . -s res://tests/run_all.gd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python 测试（与平台无关）
        run: python -I -B -m unittest discover -s tools/input_overlay -p "test_*.py" -v

  windows:
    name: Windows（Windows 专用 Python 测试）
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 输入显示层测试（含结构体布局）
        run: python -I -B -m unittest discover -s tools/input_overlay -p "test_*.py" -v

      - name: P0-4 spike 工具测试（Raw Input 计数器、比对脚本）
        run: python -I -B -m unittest discover -s spikes/raw-input/tools -p "test_*.py" -v
